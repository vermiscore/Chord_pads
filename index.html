<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chord Pad</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#f3f1ec;--fg:#1c1b19;--pad:#fff;--bd:#d2cdc1;--ac:#2f6f5e;--acfg:#fff;--mut:#6b675e;--hi:#e7b94a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181c;--fg:#ecebe6;--pad:#232830;--bd:#363d48;--ac:#5fb59c;--acfg:#10201b;--mut:#9aa0a8;--hi:#d9a93a}}
:root[data-theme="dark"]{--bg:#15181c;--fg:#ecebe6;--pad:#232830;--bd:#363d48;--ac:#5fb59c;--acfg:#10201b;--mut:#9aa0a8;--hi:#d9a93a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Helvetica Neue",sans-serif}
main{max-width:560px;margin:0 auto;padding:10px 8px 24px}
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.opt{height:38px;border:1.5px solid var(--bd);border-radius:10px;background:var(--pad);color:var(--fg);font:inherit;font-size:15px;touch-action:manipulation}
.opt.sel{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:6px 0 8px}
.bo{display:grid;grid-template-columns:1fr 56px 40px 56px;gap:5px;align-items:center;margin:0 0 8px;font-size:13px;color:var(--mut)}
.bo .opt{height:34px}
#boVal{text-align:center;color:var(--fg);font-weight:600}
.info{position:sticky;top:0;z-index:2;margin:0 0 6px;padding:8px 12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg)}
.info b{font-size:11px;color:var(--mut);font-weight:500;margin-right:8px}
#notes{font-size:16px;font-weight:600}
h2.sec{margin:14px 2px 4px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--ac)}
.cap{margin:6px 2px 2px;font-size:11px;color:var(--mut)}
.row{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
button.pad,.empty{height:46px;border-radius:8px;min-width:0}
button.pad{border:1.5px solid var(--bd);background:var(--pad);color:var(--fg);font:inherit;font-size:13px;font-weight:600;padding:0 1px;touch-action:manipulation;user-select:none;white-space:nowrap}
button.pad.sm{font-size:10.5px}
button.pad.tonic{border-color:var(--ac)}
button.pad:active,button.pad.on{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
/* Song (GP import) */
.song{margin:0 0 10px;padding:8px;border:1.5px solid var(--bd);border-radius:12px}
.songbar{display:grid;grid-template-columns:64px 1fr;gap:5px}
.songbar label.opt{display:flex;align-items:center;justify-content:center;cursor:pointer}
.songbar input{display:none}
#songInfo{margin:6px 2px 0}
.songopts{display:grid;grid-template-columns:auto 1fr;gap:5px 8px;align-items:center;margin:8px 0;font-size:12px;color:var(--mut)}
.songopts select{height:32px;min-width:0;border:1.5px solid var(--bd);border-radius:8px;background:var(--pad);color:var(--fg);font:inherit;font-size:13px}
.speed{display:grid;grid-template-columns:1fr 44px;gap:6px;align-items:center}
.speed input{width:100%;accent-color:var(--ac)}
.now{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:4px 10px;padding:6px 10px;border-radius:10px;background:var(--pad);border:1.5px solid var(--bd)}
#nowC{font-size:28px;font-weight:700}
#nextC{font-size:14px;color:var(--mut);text-align:right}
#barPos{grid-column:1/-1;font-size:11px;color:var(--mut)}
#timeline{margin-top:6px;max-height:190px;overflow-y:auto;display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start}
#timeline .tsec{flex-basis:100%;margin:6px 2px 1px;font-size:11px;font-weight:600;color:var(--ac);text-transform:uppercase;letter-spacing:.04em}
#timeline button{border:1.5px solid var(--bd);background:var(--pad);color:var(--fg);border-radius:7px;font:inherit;font-size:12px;font-weight:600;padding:4px 6px;touch-action:manipulation}
#timeline button small{display:block;font-size:9px;font-weight:400;color:var(--mut)}
#timeline button.cur{background:var(--hi);border-color:var(--hi);color:#1c1b19}
#timeline button.cur small{color:#1c1b19}
button.pad.song{box-shadow:0 0 0 3px var(--hi)}
.hide{display:none!important}
</style></head><body><main>
<section class="song">
  <div class="songbar">
    <button class="opt" id="playBtn" disabled>▶</button>
    <label class="opt">Load .gp file<input type="file" id="gpFile" accept=".gp"></label>
  </div>
  <div class="cap" id="songInfo">Guitar Pro 7/8 (.gp)</div>
  <div id="songUI" class="hide">
    <div class="songopts">
      <span>Chords from</span><select id="chordTrk"></select>
      <span>Bass from</span><select id="bassTrk"></select>
      <span>Melody from</span><select id="melTrk"></select>
      <span>Melody pitch</span><select id="melOct"><option value="1">1 octave up (easier to hear)</option><option value="0">As written</option></select>
      <span>Style</span><select id="style"><option value="beat">Strum every beat</option><option value="hit">Only on chord change</option></select>
      <span>Speed</span><div class="speed"><input type="range" id="speed" min="50" max="150" step="5" value="100"><span id="speedVal">100%</span></div>
      <span>Melody vol</span><div class="speed"><input type="range" id="volMel" min="0" max="100" value="70"><span id="volMelVal">70</span></div>
      <span>Chord vol</span><div class="speed"><input type="range" id="volChord" min="0" max="100" value="70"><span id="volChordVal">70</span></div>
      <span>Bass vol</span><div class="speed"><input type="range" id="volBass" min="0" max="100" value="70"><span id="volBassVal">70</span></div>
    </div>
    <div class="now"><span id="nowC">–</span><span id="nextC"></span><span id="barPos"></span></div>
    <div id="timeline"></div>
  </div>
</section>
<div class="keys" id="keys"></div>
<div class="mode" id="mode"></div>
<div class="bo"><span>Octave (bass + chord)</span><button class="opt" id="boDn">−</button><span id="boVal"></span><button class="opt" id="boUp">+</button></div>
<div class="info"><b>Notes (low to high)</b><span id="notes">Tap a chord</span></div>
<div id="sections"></div>
</main>
<script>
// Pitch class names: key-dependent spelling (sharps or flats)
const FLAT=['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
const SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const SHARP_MAJOR_KEYS=new Set([1,2,4,6,7,9,11]); // major keys conventionally written with sharps
const SCALES={Major:[0,2,4,5,7,9,11],Minor:[0,2,3,5,7,8,10]};
// Chord quality suffix by interval set
const QUAL={'0,4,7':'','0,3,7':'m','0,3,6':'dim','0,4,8':'aug',
  '0,4,7,11':'maj7','0,3,7,10':'m7','0,4,7,10':'7','0,3,6,10':'m7♭5','0,3,7,11':'m(maj7)','0,3,6,9':'dim7',
  '0,2,7':'sus2','0,5,7':'sus4','0,5,7,10':'7sus4','0,4,7,9':'6','0,3,7,9':'m6'};
let key=9,mode='Major',ctx=null,cur=[];
const mod12=x=>((x%12)+12)%12;
const names=()=>SHARP_MAJOR_KEYS.has(mode==='Major'?key:mod12(key+3))?SHARP:FLAT;
const noteName=m=>names()[mod12(m)]+(Math.floor(m/12)-1);

// Build a chord: root pitch class, interval list, optional bass pitch class.
// Only pitch classes are stored; actual octaves are chosen at play time by voice leading.
function mk(root,iv,bass){
  const N=names(),r=mod12(root),b=(bass==null||mod12(bass)===r)?null:mod12(bass); // bass equal to root is not a slash chord
  const q=QUAL[iv.join(',')];
  if(q===undefined)return null;
  return{n:N[r]+q+(b!=null?'/'+N[b]:''),sig:r+':'+iv.join(',')+':'+(b==null?'':b),
         bp:(b==null?r:b),pcs:iv.map(i=>mod12(r+i))};
}
// Diatonic info for degree d of a scale (thirds, fifths, sevenths above the root)
function deg(scale,d){
  const s=scale.concat(scale.map(x=>x+12)),r=s[d];
  return{root:key+r,t:s[d+2]-r,f:s[d+4]-r,v:s[d+6]-r};
}
function build(){
  const sc=SCALES[mode],alt=mode==='Major'?SCALES.Minor:SCALES.Major;
  const seen=new Set();
  // Add a chord to a row unless an identical chord already appears earlier (blank cell instead)
  const cell=(c,tonic)=>{
    if(!c||seen.has(c.sig))return null;
    seen.add(c.sig);if(tonic)c.tonic=true;return c;
  };
  const row=(label,fn,scale)=>({label,cells:(scale||sc).map((_,d)=>fn(deg(scale||sc,d),d))});
  const dom=(scale)=>mod12(key+scale[4]);
  const fifth=x=>x.f===7;
  return[
    {title:'Diatonic',rows:[
      row('Triads',(x,d)=>cell(mk(x.root,[0,x.t,x.f]),d===0)),
      row('7th',(x,d)=>cell(mk(x.root,[0,x.t,x.f,x.v]))),
      row('sus2',x=>fifth(x)?cell(mk(x.root,[0,2,7])):null),
      row('sus4',x=>fifth(x)?cell(mk(x.root,[0,5,7])):null),
      row('7sus4',x=>fifth(x)?cell(mk(x.root,[0,5,7,10])):null),
      row('6th',x=>fifth(x)&&(x.t===3||x.t===4)?cell(mk(x.root,[0,x.t,x.f,9])):null),
    ]},
    {title:'Inversions / slash chords',rows:[
      row('1st inversion (3rd in bass)',x=>cell(mk(x.root,[0,x.t,x.f],x.root+x.t))),
      row('2nd inversion (5th in bass)',x=>cell(mk(x.root,[0,x.t,x.f],x.root+x.f))),
      row('Triad over V bass',x=>cell(mk(x.root,[0,x.t,x.f],dom(sc)))),
      row('7th over V bass',x=>cell(mk(x.root,[0,x.t,x.f,x.v],dom(sc)))),
    ]},
    {title:'Secondary dominants',rows:[
      row('V of each degree (triad)',(x,d)=>d>0&&fifth(x)?cell(mk(x.root+7,[0,4,7])):null),
      row('V7 of each degree',(x,d)=>d>0&&fifth(x)?cell(mk(x.root+7,[0,4,7,10])):null),
      row('V of each degree (1st inversion)',(x,d)=>d>0&&fifth(x)?cell(mk(x.root+7,[0,4,7],x.root+11)):null),
    ]},
    {title:'Borrowed ('+(mode==='Major'?'parallel minor':'parallel major')+')',rows:[
      row('Triads',x=>cell(mk(x.root,[0,x.t,x.f])),alt),
      row('7th',x=>cell(mk(x.root,[0,x.t,x.f,x.v])),alt),
      row('6th',x=>fifth(x)&&(x.t===3||x.t===4)?cell(mk(x.root,[0,x.t,x.f,9])):null,alt),
      row('1st inversion',x=>cell(mk(x.root,[0,x.t,x.f],x.root+x.t)),alt),
      row('2nd inversion',x=>cell(mk(x.root,[0,x.t,x.f],x.root+x.f)),alt),
    ]},
  ];
}
// One note. Envelope gain (g) -> damper gain (d) -> output.
// The damper has no automation of its own, so a note can be cut cleanly at any time.
// Bass notes get stronger upper harmonics so the pitch is audible on small phone speakers.
function tone(m,t,bass,vel=1){
  const f=440*Math.pow(2,(m-69)/12),g=ctx.createGain(),d=ctx.createGain();
  g.connect(d);d.connect(bass?bus.bass:bus.chord);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime((bass?.13:.16)*vel,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+2.4);
  // Bass fundamentals (E2-A3, 82-220 Hz) are below what small speakers reproduce, so the bass
  // carries strong harmonics up to the 6th; the ear still hears the low pitch from them.
  (bass?[[1,.8],[2,1],[3,.8],[4,.6],[5,.4],[6,.25]]:[[1,1],[2,.35],[3,.12]]).forEach(([h,a])=>{const o=ctx.createOscillator(),q=ctx.createGain();o.frequency.value=f*h;q.gain.value=a;o.connect(q);q.connect(g);o.start(t);o.stop(t+2.5)});
  return d;
}
// Fade out a set of damper gains starting at time t
function damp(list,t){
  list.forEach(d=>{try{d.gain.cancelScheduledValues(t);d.gain.setValueAtTime(d.gain.value,t);d.gain.setTargetAtTime(0,t,.03)}catch(e){}});
}
// Melody note: lead voice held for the note's length.
// A pure sine in the vocal range (200-350 Hz) is nearly silent on laptop/phone speakers and
// sits under the chords, so the voice has strong upper harmonics (reed/organ-like) and is
// played an octave up by default (melOct).
let melWave=null;
function melTone(m,t,len,vel=1){
  if(!melWave){
    const amps=[0,1,.7,.5,.35,.25,.15,.1];               // harmonic amplitudes 1..7
    melWave=ctx.createPeriodicWave(new Float32Array(amps.length),new Float32Array(amps));
  }
  const f=440*Math.pow(2,(m+12*melOct-69)/12),g=ctx.createGain(),d=ctx.createGain();
  g.connect(d);d.connect(bus.mel);
  const end=t+Math.max(len,.06);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16*vel,t+.02);
  g.gain.setTargetAtTime(.11*vel,t+.02,.15);                  // settle to sustain level
  g.gain.setTargetAtTime(0,end-.02,.05);                       // release at note end
  const o=ctx.createOscillator();o.setPeriodicWave(melWave);o.frequency.value=f;
  o.connect(g);o.start(t);o.stop(end+.4);
  return d;
}
let melOct=1;
// Separate output buses so melody, chords and bass have their own volume
const bus={};
const volOf=id=>{const v=+document.getElementById(id).value/100;return v*v};  // squared: more natural fader feel
function applyVolumes(){
  if(!ctx)return;
  bus.mel.gain.setTargetAtTime(volOf('volMel')*1.4,ctx.currentTime,.02);
  bus.chord.gain.setTargetAtTime(volOf('volChord')*2,ctx.currentTime,.02);
  bus.bass.gain.setTargetAtTime(volOf('volBass')*2,ctx.currentTime,.02);
}
function ensureCtx(){
  if(!ctx){
    ctx=new(window.AudioContext||window.webkitAudioContext)();
    ['mel','chord','bass'].forEach(k=>{bus[k]=ctx.createGain();bus[k].connect(ctx.destination)});
    applyVolumes();
  }
  if(ctx.state!=='running')ctx.resume();
}

// ---- Voicing (guitar-like) ----
// Global octave shift applied to bass and chord together (keeps their spacing).
let oct=0;
// Voice-leading state: previous bass and upper notes (MIDI). Each new chord moves the
// shortest way from the previous one, like a guitarist, instead of jumping to a fixed range.
let prevBass=null,prevUp=null;
const resetVoicing=()=>{prevBass=null;prevUp=null};

// Bass in the guitar's low-string range: E2 (40) .. A3 (57).
// First chord takes the lowest option (open-string position); later chords take the nearest
// option, so stepwise bass lines (A-G#-F#-E, C-B-A) keep moving in the right direction.
function pickBass(pc){
  const lo=40+12*oct,hi=57+12*oct,c=[];
  for(let m=lo;m<=hi;m++)if(mod12(m)===pc)c.push(m);
  if(prevBass==null)return c[0];
  return c.reduce((a,m)=>Math.abs(m-prevBass)<Math.abs(a-prevBass)?m:a);
}
// Upper voices: close position, lowest note between E3 (52) and D#4 (63), always above the bass.
// Among all inversions, choose the one closest to the previous chord's upper voices.
function pickUpper(pcs,bass){
  const lo=52+12*oct,cands=[];
  for(let s=lo;s<lo+24;s++){
    const i=pcs.indexOf(mod12(s));if(i<0)continue;
    const v=[s];
    for(let k=1;k<pcs.length;k++){
      const p=pcs[(i+k)%pcs.length];let m=v[v.length-1]+1;
      while(mod12(m)!==p)m++;
      v.push(m);
    }
    if(v[0]>bass)cands.push(v);
    if(cands.length>=pcs.length*2)break; // enough candidates (two octaves of inversions)
  }
  const near=(a,b)=>a.reduce((s,m)=>s+Math.min(...b.map(p=>Math.abs(p-m))),0);
  const cost=v=>prevUp==null?Math.abs(v[0]-(57+12*oct)):near(v,prevUp)+near(prevUp,v);
  return cands.reduce((a,v)=>cost(v)<cost(a)?v:a);
}
// Choose bass + upper notes for a chord and update the voice-leading state
function voice(c){
  const bm=pickBass(c.bp),up=pickUpper(c.pcs,bm);
  prevBass=bm;prevUp=up;
  return [bm].concat(up);
}
// Strum: small delay between notes, low to high
function strum(all,t,vel){
  return all.map((m,i)=>tone(m,t+i*.018,i===0,vel));
}
function play(c,el){
  ensureCtx();
  const now=ctx.currentTime;
  damp(cur,now);
  const all=voice(c);
  cur=strum(all,now,1);
  document.getElementById('notes').textContent=c.n+': '+all.map(noteName).join(' – ');
  document.querySelectorAll('.pad.on').forEach(b=>b.classList.remove('on'));el.classList.add('on');
}
function render(){
  resetVoicing();
  document.querySelectorAll('#keys .opt').forEach((b,i)=>b.classList.toggle('sel',i===key));
  document.querySelectorAll('#mode .opt').forEach(b=>b.classList.toggle('sel',b.textContent===mode));
  document.querySelectorAll('#keys .opt').forEach((b,i)=>b.textContent=FLAT[i]);
  const root=document.getElementById('sections');root.innerHTML='';
  build().forEach(sec=>{
    const h=document.createElement('h2');h.className='sec';h.textContent=sec.title;root.appendChild(h);
    sec.rows.forEach(r=>{
      const cap=document.createElement('div');cap.className='cap';cap.textContent=r.label;root.appendChild(cap);
      const g=document.createElement('div');g.className='row';
      r.cells.forEach(c=>{
        if(!c){const e=document.createElement('div');e.className='empty';g.appendChild(e);return}
        const b=document.createElement('button');
        b.className='pad'+(c.tonic?' tonic':'')+(c.n.length>6?' sm':'');
        b.textContent=c.n;b.dataset.sig=c.sig;
        b.addEventListener('pointerdown',e=>{e.preventDefault();play(c,b)});g.appendChild(b);
      });
      root.appendChild(g);
    });
  });
  document.getElementById('notes').textContent='Tap a chord';
  if(song)renderTimeline();
}

// =====================================================================
// Song import: Guitar Pro 7/8 (.gp = zip containing Content/score.gpif)
// =====================================================================

// Interval sets for chord labels, by suffix. Pad qualities plus a few common spellings.
const SUFFIX={};
for(const k in QUAL)SUFFIX[QUAL[k]]=k.split(',').map(Number);
Object.assign(SUFFIX,{'maj':[0,4,7],'M':[0,4,7],'min':[0,3,7],'-':[0,3,7],'M7':[0,4,7,11],'m7b5':[0,3,6,10],
  'sus':[0,5,7],'°':[0,3,6],'+':[0,4,8],'5':[0,7],'add9':[0,2,4,7],'9':[0,2,4,7,10],'m9':[0,2,3,7,10],'maj9':[0,2,4,7,11]});
const LETTER={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const accOf=s=>s==='#'||s==='♯'?1:s==='b'||s==='♭'?-1:0;

// Chord object used by the song player. sig matches the pad's sig when the chord is on the pad.
function chordObj(r,iv,b,label){
  const bb=(b==null||b===r)?null:b;
  return{r,iv,b:bb,bp:bb==null?r:bb,pcs:iv.map(i=>mod12(r+i)),
         sig:r+':'+iv.join(',')+':'+(bb==null?'':bb),label:label||null};
}
function parseChord(label){
  const m=label.trim().match(/^([A-G])([#♯b♭]?)([^/]*)(?:\/([A-G])([#♯b♭]?))?$/);
  if(!m)return null;
  const iv=SUFFIX[m[3].trim()];
  if(!iv)return null;
  const r=mod12(LETTER[m[1]]+accOf(m[2]));
  const b=m[4]?mod12(LETTER[m[4]]+accOf(m[5])):null;
  return chordObj(r,iv,b,label.trim());
}
// Display name: label from the file if there was one, otherwise spelled in the current key
function chordName(c){
  if(c.label)return c.label.replace(/♯/g,'#');   // same sharp sign as the pads
  const N=names(),q=QUAL[c.iv.join(',')];
  return N[c.r]+(q==null?'?':q)+(c.b!=null?'/'+N[c.b]:'');
}

// Small XML helpers (direct children only, so nested elements with the same tag are ignored)
const kid=(el,tag)=>el?[...el.children].find(c=>c.tagName===tag):null;
const kids=(el,tag)=>el?[...el.children].filter(c=>c.tagName===tag):[];
const txt=(el,...path)=>{for(const t of path)el=kid(el,t);return el?el.textContent.trim():null};
const byId=list=>{const m={};list.forEach(e=>m[e.getAttribute('id')]=e);return m};

const NOTE_VALUE={Whole:4,Half:2,Quarter:1,Eighth:.5,'16th':.25,'32nd':.125,'64th':.0625,'128th':.03125};
// Tempo unit codes in GP automations -> factor to quarter-note BPM
const TEMPO_UNIT={1:.5,2:1,3:1.5,4:2,5:3};

function parseGpif(xml){
  const root=xml.documentElement;
  const tracksEl=kids(kid(root,'Tracks'),'Track');
  const bars=byId(kids(kid(root,'Bars'),'Bar'));
  const voices=byId(kids(kid(root,'Voices'),'Voice'));
  const beats=byId(kids(kid(root,'Beats'),'Beat'));
  const notes=byId(kids(kid(root,'Notes'),'Note'));
  const rhythms=byId(kids(kid(root,'Rhythms'),'Rhythm'));

  // Rhythm duration in quarter notes (dots and tuplets)
  const durCache={};
  const dur=id=>{
    if(durCache[id]!=null)return durCache[id];
    const r=rhythms[id];let d=NOTE_VALUE[txt(r,'NoteValue')]||1;
    const dot=kid(r,'AugmentationDot');
    if(dot){const n=+dot.getAttribute('count');d*=2-Math.pow(.5,n)}
    const tup=kid(r,'PrimaryTuplet');
    if(tup)d*=(+tup.getAttribute('den'))/(+tup.getAttribute('num'));
    return durCache[id]=d;
  };
  const noteMidi=id=>{
    const p=[...notes[id].getElementsByTagName('Property')].find(p=>p.getAttribute('name')==='Midi');
    return p?parseInt(txt(p,'Number')):null;
  };

  // Master bars: time signature, bar ids per track, section, repeats
  const mbs=kids(kid(root,'MasterBars'),'MasterBar').map(mb=>{
    const [n,d]=(txt(mb,'Time')||'4/4').split('/').map(Number);
    const rep=kid(mb,'Repeat');
    const alt=txt(mb,'AlternateEndings');
    return{len:n*4/d,barIds:(txt(mb,'Bars')||'').split(/\s+/),
      section:txt(mb,'Section','Text'),
      repStart:rep?rep.getAttribute('start')==='true':false,
      repEnd:rep?rep.getAttribute('end')==='true':false,
      repCount:rep?Math.max(2,+rep.getAttribute('count')||2):0,
      alt:alt?alt.split(/\s+/).map(Number).filter(x=>x>0):[]};
  });
  let acc=0;mbs.forEach(mb=>{mb.start=acc;acc+=mb.len});

  // Tempo per master bar (quarter-note BPM), carried forward
  const tempoAt={};
  const autos=kid(kid(root,'MasterTrack'),'Automations');
  kids(autos,'Automation').forEach(a=>{
    if(txt(a,'Type')!=='Tempo')return;
    const [bpm,unit]=(txt(a,'Value')||'120 2').split(/\s+/).map(Number);
    tempoAt[+txt(a,'Bar')]=bpm*(TEMPO_UNIT[unit]||1);
  });
  let bpm=tempoAt[0]||120;
  mbs.forEach((mb,i)=>{if(tempoAt[i]!=null)bpm=tempoAt[i];mb.bpm=bpm});

  // Tracks: name, type, chord-diagram names (for chord labels on beats)
  const tracks=tracksEl.map((t,i)=>{
    const diag={};
    [...t.getElementsByTagName('Property')].filter(p=>p.getAttribute('name')==='DiagramCollection')
      .forEach(p=>[...p.getElementsByTagName('Item')].forEach(it=>diag[it.getAttribute('id')]=it.getAttribute('name')));
    return{i,name:(txt(t,'Name')||'Track '+(i+1)).replace(/\s+/g,' '),
      type:txt(t,'InstrumentSet','Type')||'',diag};
  });

  // Walk one track: note events {s,d,m,mi,pos} (s = absolute quarter time in score order)
  // and chord labels {mi,pos,label}. A tied note extends the note it continues instead of
  // starting a new one, so held melody notes are not re-attacked.
  const cache={};
  function walk(ti){
    if(cache[ti])return cache[ti];
    const ev=[],labels=[],open={};   // open: midi -> last event (for ties)
    mbs.forEach((mb,mi)=>{
      const bar=bars[mb.barIds[ti]];if(!bar)return;
      (txt(bar,'Voices')||'').split(/\s+/).forEach(vid=>{
        if(vid==='-1'||!voices[vid])return;
        let pos=0;
        (txt(voices[vid],'Beats')||'').split(/\s+/).forEach(bid=>{
          const b=beats[bid];if(!b)return;
          const d=kid(b,'GraceNotes')?0:dur(kid(b,'Rhythm').getAttribute('ref'));
          const ch=txt(b,'Chord');
          if(ch!=null&&tracks[ti].diag[ch])labels.push({mi,pos,label:tracks[ti].diag[ch]});
          const ns=txt(b,'Notes');
          if(ns)ns.split(/\s+/).forEach(nid=>{
            const m=notes[nid]&&noteMidi(nid);if(m==null)return;
            const tie=kid(notes[nid],'Tie'),s=mb.start+pos,len=Math.max(d,.125);
            const p=open[m];
            if(tie&&tie.getAttribute('destination')==='true'&&p&&Math.abs(p.s+p.d-s)<.01){p.d+=len;return}
            const e={s,d:len,m,mi,pos};ev.push(e);open[m]=e;
          });
          pos+=d;
        });
      });
    });
    return cache[ti]={ev,labels};
  }
  return{title:txt(kid(root,'Score'),'Title'),artist:txt(kid(root,'Score'),'Artist'),tracks,mbs,walk};
}

// Chord detection from sounding notes in [a,b): weighted pitch-class histogram matched against
// the pad's chord templates (same idea as the earlier composition tool: templates per bar).
// Bass = earliest-sounding note of the bass source.
const TEMPLATES=Object.keys(QUAL).map(k=>k.split(',').map(Number));
function detect(ev,bev,a,b){
  const h=new Array(12).fill(0);let any=false;
  for(const e of ev){
    const o=Math.min(e.s+e.d,b)-Math.max(e.s,a);
    if(o>0){h[e.m%12]+=o*(e.s>=a?1.5:1);any=true}
  }
  let bass=null,bs=Infinity,bm=Infinity;
  for(const e of bev){
    if(Math.min(e.s+e.d,b)-Math.max(e.s,a)<=0)continue;
    const s=Math.max(e.s,a);
    if(s<bs||(s===bs&&e.m<bm)){bs=s;bm=e.m;bass=e.m%12}
  }
  if(!any&&bass==null)return null;
  if(bass!=null)h[bass]+=1;
  const tot=h.reduce((x,y)=>x+y,0)||1;
  let best=null;
  for(let r=0;r<12;r++)for(const iv of TEMPLATES){
    const pcs=new Set(iv.map(i=>(r+i)%12));
    let sc=0;
    for(let p=0;p<12;p++)sc+=pcs.has(p)?h[p]:-1.2*h[p];
    sc-=.15*tot*(iv.length-3);                       // prefer plain triads
    for(const p of pcs)if(h[p]===0)sc-=.25*tot;      // missing chord tone
    if(bass===r)sc+=.1*tot;
    if(!best||sc>best.sc)best={sc,r,iv};
  }
  return chordObj(best.r,best.iv,bass);
}

// Build per-bar chord segments: file labels where the bar has them, detection elsewhere.
function analyze(gp,chordTi,bassTi){
  const src=gp.walk(chordTi);
  const bev=bassTi>=0?gp.walk(bassTi).ev:src.ev;
  // Labels: chosen track first, then any other track for bars still unlabeled
  const lab={};
  const addLabels=list=>list.forEach(l=>{const c=parseChord(l.label);if(c)(lab[l.mi]=lab[l.mi]||[]).push({pos:l.pos,c})});
  addLabels(src.labels);
  gp.tracks.forEach((t,ti)=>{
    if(ti===chordTi||!Object.keys(t.diag).length)return;
    gp.walk(ti).labels.forEach(l=>{if(!lab[l.mi]||lab[l.mi].fromOther){const c=parseChord(l.label);if(c){(lab[l.mi]=lab[l.mi]||Object.assign([],{fromOther:true})).push({pos:l.pos,c})}}});
  });
  // Detection only needs notes near each window; events are sorted once
  const ev=src.ev.slice().sort((x,y)=>x.s-y.s);
  let prev=null,labeled=0;
  gp.mbs.forEach((mb,mi)=>{
    let segs=[];
    if(lab[mi]&&lab[mi].length){
      segs=lab[mi].slice().sort((x,y)=>x.pos-y.pos).map(x=>({pos:x.pos,c:x.c}));
      labeled++;
    }else{
      const win=mb.len%2===0?2:mb.len;
      const near=ev.filter(e=>e.s<mb.start+mb.len&&e.s+e.d>mb.start);
      const nearB=bev.filter(e=>e.s<mb.start+mb.len&&e.s+e.d>mb.start);
      for(let p=0;p<mb.len;p+=win){
        const c=detect(near,nearB,mb.start+p,mb.start+p+win);
        if(c)segs.push({pos:p,c});   // empty window: previous chord rings on
      }
    }
    if(prev&&(!segs.length||segs[0].pos>0))segs.unshift({pos:0,c:prev});
    // Merge repeated chords inside the bar
    segs=segs.filter((s,i)=>i===0||s.c.sig!==segs[i-1].c.sig);
    mb.segs=segs;
    if(segs.length)prev=segs[segs.length-1].c;
  });
  return{labeled};
}

// Play order with simple repeats and alternate endings
function playOrder(mbs){
  const order=[];let i=0,rs=0,pass=1,guard=0;
  while(i<mbs.length&&guard++<20000){
    const mb=mbs[i];
    if(mb.repStart&&i!==rs){rs=i;pass=1}
    if(mb.alt.length&&!mb.alt.includes(pass)){i++;continue}
    order.push(i);
    if(mb.repEnd&&pass<mb.repCount){pass++;i=rs;continue}
    if(mb.repEnd){rs=i+1;pass=1}
    i++;
  }
  return order;
}

// Song = flattened chord changes in play order, with times in seconds (at 100% speed)
let gp=null,song=null;
function buildSong(){
  const order=playOrder(gp.mbs);
  const chips=[],beatsT=[],mel=[];let t=0;
  // Melody notes grouped by bar, placed in play order below
  const melTi=+$('melTrk').value,melByBar={};
  if(melTi>=0)gp.walk(melTi).ev.forEach(e=>(melByBar[e.mi]=melByBar[e.mi]||[]).push(e));
  order.forEach((mi,k)=>{
    const mb=gp.mbs[mi],spq=60/mb.bpm;
    for(let q=0;q<mb.len;q++)beatsT.push(t+q*spq);
    (melByBar[mi]||[]).forEach(e=>mel.push({t:t+e.pos*spq,len:e.d*spq,m:e.m}));
    mb.segs.forEach(s=>{
      const last=chips[chips.length-1];
      if(last&&last.c.sig===s.c.sig)return;          // same chord continues across the bar line
      chips.push({c:s.c,t:t+s.pos*spq,mi,pos:s.pos,section:(s.pos===0&&mb.section)?mb.section:null,k});
    });
    // Section header even when the chord does not change at the section start
    if(mb.section){const c=chips.find(x=>x.k===k&&x.pos===0);if(!c&&chips.length)chips[chips.length-1].sectionAfter=mb.section}
    t+=mb.len*spq;
  });
  chips.forEach((c,i)=>c.end=i+1<chips.length?chips[i+1].t:t);
  mel.sort((a,b)=>a.t-b.t);
  song={chips,beatsT,mel,total:t};
}
// Guess the key from the most-played major/minor chord (by duration)
function guessKey(){
  const w={};
  song.chips.forEach(ch=>{
    const q=ch.c.iv.join(',');
    if(q!=='0,4,7'&&q!=='0,3,7'&&q!=='0,4,7,10'&&q!=='0,3,7,10')return;
    const k=ch.c.r+(q.startsWith('0,3')?'m':'');
    w[k]=(w[k]||0)+(ch.end-ch.t);
  });
  const best=Object.keys(w).sort((a,b)=>w[b]-w[a])[0];
  if(!best)return;
  key=parseInt(best);mode=best.endsWith('m')?'Minor':'Major';
}

// ---- Timeline UI ----
const $=id=>document.getElementById(id);
function renderTimeline(){
  const tl=$('timeline');tl.innerHTML='';
  song.chips.forEach((ch,i)=>{
    if(ch.section){const h=document.createElement('div');h.className='tsec';h.textContent=ch.section;tl.appendChild(h)}
    const b=document.createElement('button');
    b.innerHTML=chordName(ch.c).replace(/</g,'&lt;')+'<small>'+(ch.mi+1)+(ch.pos?'.'+(ch.pos+1):'')+'</small>';
    b.onclick=()=>startPlay(ch.t);
    tl.appendChild(b);ch.el=b;
    if(ch.sectionAfter){const h=document.createElement('div');h.className='tsec';h.textContent=ch.sectionAfter;tl.appendChild(h)}
  });
  showChip(player.chip>=0?player.chip:-1);
}
function showChip(i){
  if(!song)return;
  song.chips.forEach((c,j)=>c.el&&c.el.classList.toggle('cur',j===i));
  document.querySelectorAll('.pad.song').forEach(b=>b.classList.remove('song'));
  if(i<0){$('nowC').textContent='–';$('nextC').textContent='';$('barPos').textContent='';return}
  const ch=song.chips[i],nx=song.chips[i+1];
  $('nowC').textContent=chordName(ch.c);
  $('nextC').textContent=nx?'next: '+chordName(nx.c):'';
  $('barPos').textContent='Bar '+(ch.mi+1)+(ch.pos?' beat '+(ch.pos+1):'');
  const pad=document.querySelector('.pad[data-sig="'+ch.c.sig+'"]');
  if(pad)pad.classList.add('song');
  // Keep the current chip visible inside the timeline box (without scrolling the page)
  const tl=$('timeline'),el=ch.el;
  if(el&&(el.offsetTop<tl.scrollTop||el.offsetTop+el.offsetHeight>tl.scrollTop+tl.clientHeight))
    tl.scrollTop=el.offsetTop-tl.offsetTop-40;
}

// ---- Player: look-ahead scheduler on the Web Audio clock ----
const player={on:false,chip:-1,timer:0,raf:0,ctx0:0,from:0,speed:1,events:[],ei:0,voiced:-1,notes:[],gains:[],mi:0,melGains:[]};
// Events in song seconds: every chord change (accent) and, in beat style, every beat
function buildEvents(from){
  const style=$('style').value,ev=[];
  const chipAt=t=>{let i=0;while(i+1<song.chips.length&&song.chips[i+1].t<=t+1e-6)i++;return i};
  song.chips.forEach((c,i)=>{if(c.end>from+1e-6)ev.push({t:Math.max(c.t,from),chip:i,acc:true})});
  if(style==='beat')song.beatsT.forEach(t=>{
    if(t<from-1e-6||ev.some(e=>Math.abs(e.t-t)<.03))return;
    ev.push({t,chip:chipAt(t),acc:false});
  });
  return ev.sort((a,b)=>a.t-b.t);
}
const songNow=()=>player.from+(ctx.currentTime-player.ctx0)*player.speed;
const toCtx=t=>player.ctx0+(t-player.from)/player.speed;
function schedule(){
  const horizon=songNow()+.2*player.speed;
  while(player.ei<player.events.length&&player.events[player.ei].t<=horizon){
    const e=player.events[player.ei++],t=toCtx(e.t);
    if(e.chip!==player.voiced){player.notes=voice(song.chips[e.chip].c);player.voiced=e.chip}
    damp(player.gains,t);
    player.gains=strum(player.notes,t,e.acc?1:.6);
  }
  // Melody notes (only the recent ones are kept for stopping; older ones have ended)
  const mel=song.mel;
  while(player.mi<mel.length&&mel[player.mi].t<=horizon){
    const n=mel[player.mi++];
    player.melGains.push(melTone(n.m,toCtx(n.t),n.len/player.speed));
    if(player.melGains.length>64)player.melGains.shift();
  }
}
function frame(){
  if(!player.on)return;
  const t=songNow();
  if(t>=song.total+1){stopPlay();return}
  let i=player.chip<0?0:player.chip;
  if(i>=song.chips.length||song.chips[i].t>t)i=0;
  while(i+1<song.chips.length&&song.chips[i+1].t<=t)i++;
  if(i!==player.chip){player.chip=i;showChip(i)}
  player.raf=requestAnimationFrame(frame);
}
function startPlay(from){
  if(!song)return;
  ensureCtx();
  stopPlay(true);
  resetVoicing();
  player.on=true;player.from=from;player.speed=+$('speed').value/100;
  player.ctx0=ctx.currentTime+.08;player.events=buildEvents(from);player.ei=0;player.voiced=-1;player.chip=-1;
  player.mi=0;while(player.mi<song.mel.length&&song.mel[player.mi].t<from-1e-6)player.mi++;
  player.timer=setInterval(schedule,25);schedule();
  player.raf=requestAnimationFrame(frame);
  $('playBtn').textContent='■';
}
function stopPlay(keepUi){
  if(player.on){clearInterval(player.timer);cancelAnimationFrame(player.raf);if(ctx){damp(player.gains,ctx.currentTime);damp(player.melGains,ctx.currentTime)}}
  player.on=false;player.gains=[];player.melGains=[];
  if(!keepUi){$('playBtn').textContent='▶'}
}
// Restart from the current position when a setting that affects scheduling changes
function restartIfPlaying(){if(player.on)startPlay(Math.max(0,songNow()))}

// ---- Load / analyze ----
function fillTrackSelects(){
  const usable=gp.tracks.filter(t=>!/drum/i.test(t.type));
  const opt=(t)=>'<option value="'+t.i+'">'+(t.i+1)+'. '+t.name.replace(/</g,'&lt;')+'</option>';
  // Default chord source (its notes are used where a bar has no chord name):
  // rhythm track, else a guitar-like track, else any track with chord labels.
  // Chord labels are read from every track regardless of this choice.
  const rhythm=usable.find(t=>/rhythm/i.test(t.name));
  const guitar=usable.find(t=>/guitar|ukulele|steel|banjo/i.test(t.type)&&!/vocal/i.test(t.name));
  const labeled=usable.find(t=>Object.keys(t.diag).length);
  const def=(rhythm||guitar||labeled||usable[0]);
  $('chordTrk').innerHTML=usable.map(opt).join('');
  $('chordTrk').value=def?def.i:'';
  const bass=usable.find(t=>/bass/i.test(t.type+' '+t.name));
  $('bassTrk').innerHTML='<option value="-1">Lowest note of chord track</option>'+usable.map(opt).join('');
  $('bassTrk').value=bass?bass.i:-1;
  // Default melody: vocal track, else a "lead" track that is not the chord source
  const vocal=usable.find(t=>/vocal|voice|melody/i.test(t.name))||usable.find(t=>/lead/i.test(t.name)&&t!==def);
  $('melTrk').innerHTML='<option value="-1">None</option>'+usable.map(opt).join('');
  $('melTrk').value=vocal?vocal.i:-1;
}
function analyzeAndShow(first){
  stopPlay();
  const r=analyze(gp,+$('chordTrk').value,+$('bassTrk').value);
  buildSong();
  if(first){guessKey();render()}else renderTimeline();
  const m=Math.floor(song.total/60),s=Math.round(song.total%60);
  $('songInfo').textContent=[gp.title,gp.artist].filter(Boolean).join(' – ')+' · '+gp.mbs.length+' bars · '+
    Math.round(gp.mbs[0].bpm)+' BPM · '+m+':'+String(s).padStart(2,'0')+' · chord names from file: '+r.labeled+' bars, detected: '+(gp.mbs.length-r.labeled)+' bars';
}
$('gpFile').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  $('songInfo').textContent='Reading '+f.name+'…';
  try{
    if(typeof JSZip==='undefined')throw new Error('zip library failed to load (offline?)');
    const zip=await JSZip.loadAsync(f);
    const x=zip.file('Content/score.gpif');
    if(!x)throw new Error('not a Guitar Pro 7/8 .gp file (.gp5 / .gpx are not supported)');
    const xml=new DOMParser().parseFromString(await x.async('string'),'application/xml');
    gp=parseGpif(xml);
    fillTrackSelects();
    $('songUI').classList.remove('hide');$('playBtn').disabled=false;
    analyzeAndShow(true);
  }catch(err){$('songInfo').textContent='Could not read file: '+err.message}
  e.target.value='';
});
$('playBtn').onclick=()=>player.on?stopPlay():startPlay(player.chip>=0&&song.chips[player.chip]?song.chips[player.chip].t:0);
$('chordTrk').onchange=$('bassTrk').onchange=$('melTrk').onchange=()=>analyzeAndShow(false);
$('melOct').onchange=()=>{melOct=+$('melOct').value;restartIfPlaying()};
['volMel','volChord','volBass'].forEach(id=>{
  $(id).oninput=()=>{$(id+'Val').textContent=$(id).value;applyVolumes()};
});
$('style').onchange=restartIfPlaying;
$('speed').oninput=()=>{$('speedVal').textContent=$('speed').value+'%'};
$('speed').onchange=restartIfPlaying;

FLAT.forEach((n,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=n;b.onclick=()=>{key=i;render()};$('keys').appendChild(b)});
['Major','Minor'].forEach(m=>{const b=document.createElement('button');b.className='opt';b.textContent=m;b.onclick=()=>{mode=m;render()};$('mode').appendChild(b)});
function showOct(){$('boVal').textContent=(oct>0?'+':'')+oct}
$('boDn').onclick=()=>{oct=Math.max(-1,oct-1);resetVoicing();showOct()};
$('boUp').onclick=()=>{oct=Math.min(2,oct+1);resetVoicing();showOct()};
showOct();
render();
</script></body></html>
